# Updates HiFi Planner prices from hifiklubben.dk once a day.
# Run it by hand under the repository's Actions tab -> "Price sync" -> "Run workflow".
name: Price sync
on:
  schedule:
    - cron: "17 4 * * *"   # every day at 04:17 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency: price-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch prices and update the catalogue
        run: |
          APP=$([ -d v2/data ] && echo v2 || echo .)
          echo "APP=$APP" >> "$GITHUB_ENV"
          node "$APP/tools/price-sync.js" "$APP/data"
      - name: Commit
        run: |
          git config user.name "HiFi Planner price sync"
          git config user.email "actions@users.noreply.github.com"
          git add "$APP/data/products.js" "$APP/data/price-sync.js"
          git diff --cached --quiet || git commit -m "Price sync from hifiklubben.dk"
          git push
