<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#141518">
  <title>HiFi Planner</title>
  <link rel="icon" href="assets/favicon.webp" type="image/webp">
  <link rel="stylesheet" href="css/app.css?v=20261125-0945">
  <!-- Google tag (gtag.js), same property as the previous version -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BW00S9FNRZ"></script>
  <script>window.dataLayer = window.dataLayer || []; function gtag() { dataLayer.push(arguments); } gtag('js', new Date()); gtag('config', 'G-BW00S9FNRZ');</script>
</head>
<body>
  <div id="app"></div>
  <noscript>HiFi Planner needs JavaScript.</noscript>
  <script src="data/config.js"></script>
  <script>
    // Catalogue data is loaded with a timestamp so shops always get the latest published version. The catalogue is generated every
    // hour by tools/catalog-build.js from data/own.js and the website mirror (README → Normalized catalogue). Rollback: load
    // 'data/products.js' here instead of the two build/ files (data/products.js is the catalogue as it was at the switch).
    (function () { var v = Date.now(); var files = ['build/app-products.js', 'build/categories.js', 'build/bundles.js', 'data/templates.js', 'data/price-sync.js'];
      try { if (localStorage.getItem('hp2.admin') === 'true') files.push('data/site-new.js'); } catch (e) { /* no storage */ } // website scan: admins only
      files.forEach(function (s) { document.write('<script src="' + s + '?t=' + v + '"><\/script>'); }); })();
  </script>
  <script>
    // the interface language: Norwegian, Swedish, Dutch, German or Finnish load their dictionary (js/i18n/, see js/core.js) before the
    // app starts. The planner uses the seller's choice (or the browser's language the first time); a customer's page (#t= / #q=)
    // uses ?l= in its link, the seller's language when the link was made, and is Danish without it.
    (function () { var l = null, n = (navigator.language || '').toLowerCase();
      try { l = JSON.parse(localStorage.getItem('hp2.lang')); } catch (e) { /* no storage */ }
      if (/^#[tq]=/.test(location.hash)) l = (/[?&]l=([a-z]{2})/.exec(location.search) || [])[1] || 'da';
      else if (!l) l = /^(nb|nn|no)\b/.test(n) ? 'nb' : n.slice(0, 2);
      if (/^(nb|sv|nl|de|fi)$/.test(l)) document.write('<script src="js/i18n/' + l + '.js?v=20261125-0945"><\/script>'); })();
  </script>
  <script src="js/ports.js?v=20261125-0945"></script>
  <script src="js/site.js?v=20261125-0945"></script>
  <script src="js/core.js?v=20261125-0945"></script>
  <script src="js/stats.js?v=20261125-0945"></script>
  <script src="js/canvas.js?v=20261125-0945"></script>
  <script src="js/panels.js?v=20261125-0945"></script>
  <script src="js/katalog.js?v=20261125-0945"></script>
  <script src="js/complete.js?v=20261125-0945"></script>
  <script src="js/qr.js?v=20261125-0945"></script>
  <script src="js/cover.js?v=20261125-0945"></script>
  <script src="js/editor.js?v=20261125-0945"></script>
  <script src="js/tour.js?v=20261125-0945"></script>
  <script src="js/main.js?v=20261125-0945"></script>
</body>
</html>
